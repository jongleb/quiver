<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 334" width="880" height="334" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #e8590c; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="10" y="18" font-size="14.5" font-weight="650">Streams: try more, keep them only if they carry more</text><rect x="10" y="36" width="158" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="89.0" y="62" font-size="14" font-weight="650" text-anchor="middle">watch</text><text x="89.0" y="80" font-size="11" text-anchor="middle" class="muted">every second: bytes acked,</text><text x="89.0" y="94" font-size="11" text-anchor="middle" class="muted">how long rendering waited</text><line x1="170" y1="71" x2="182" y2="71" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round"/><polygon points="186,71 177,66 177,76" fill="#e8590c" transform="rotate(0.0 186 71)"/><rect x="188" y="36" width="158" height="70" rx="12" fill="#fff1e8" stroke="#e8590c"/><text x="267.0" y="62" font-size="14" font-weight="650" text-anchor="middle">try ×2</text><text x="267.0" y="80" font-size="11" text-anchor="middle" class="muted">when rendering waited</text><text x="267.0" y="94" font-size="11" text-anchor="middle" class="muted">10 % or more</text><line x1="348" y1="71" x2="360" y2="71" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round"/><polygon points="364,71 355,66 355,76" fill="#e8590c" transform="rotate(0.0 364 71)"/><rect x="366" y="36" width="158" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="445.0" y="62" font-size="14" font-weight="650" text-anchor="middle">warm up</text><text x="445.0" y="80" font-size="11" text-anchor="middle" class="muted">one interval</text><line x1="526" y1="71" x2="538" y2="71" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round"/><polygon points="542,71 533,66 533,76" fill="#e8590c" transform="rotate(0.0 542 71)"/><rect x="544" y="36" width="158" height="70" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="623.0" y="62" font-size="14" font-weight="650" text-anchor="middle">measure</text><text x="623.0" y="80" font-size="11" text-anchor="middle" class="muted">two intervals</text><line x1="704" y1="71" x2="716" y2="71" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round"/><polygon points="720,71 711,66 711,76" fill="#e8590c" transform="rotate(0.0 720 71)"/><rect x="722" y="36" width="158" height="70" rx="12" fill="#fff1e8" stroke="#e8590c"/><text x="801.0" y="62" font-size="14" font-weight="650" text-anchor="middle">keep</text><text x="801.0" y="80" font-size="11" text-anchor="middle" class="muted">+10 % or more</text><path d="M 670 108 C 670 150, 600 150, 520 150 L 260 150 C 180 150, 90 150, 89 110" fill="none" stroke="#59636e" stroke-width="1.6" stroke-dasharray="5 5"/><polygon points="89,108 84,118 94,118" fill="#59636e"/><text x="380" y="168" font-size="11.5" text-anchor="middle" class="muted">less than +10 %: close them again, 30 quiet intervals, the next try asks ×1.25</text><text x="10" y="214" font-size="14.5" font-weight="650">Compression: the cheapest rung that keeps the link busy</text><rect x="10" y="232" width="190" height="54" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="105.0" y="257" font-size="14" font-weight="650" text-anchor="middle" class="mono">none</text><text x="105.0" y="274" font-size="11" text-anchor="middle" class="muted">loopback, 10G+</text><rect x="236" y="232" width="190" height="54" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="331.0" y="257" font-size="14" font-weight="650" text-anchor="middle" class="mono">zstd −5</text><text x="331.0" y="274" font-size="11" text-anchor="middle" class="muted"></text><rect x="462" y="232" width="190" height="54" rx="12" fill="#fff1e8" stroke="#e8590c"/><text x="557.0" y="257" font-size="14" font-weight="650" text-anchor="middle" class="mono">zstd 1</text><text x="557.0" y="274" font-size="11" text-anchor="middle" class="muted">start</text><rect x="688" y="232" width="190" height="54" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="783.0" y="257" font-size="14" font-weight="650" text-anchor="middle" class="mono">zstd 3</text><text x="783.0" y="274" font-size="11" text-anchor="middle" class="muted">thin links</text><line x1="40" y1="304" x2="836" y2="304" stroke="#e8590c" stroke-width="1.8" stroke-linecap="round"/><polygon points="840,304 831,299 831,309" fill="#e8590c" transform="rotate(0.0 840 304)"/><text x="440" y="324" font-size="11.5" text-anchor="middle" class="muted">up when rendering waits for the network · down when streams wait for frames · a step stays only at +5 %</text></svg>
