<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #9198a1; }
    .accent { fill: #ff8a3d; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="0" y="18" font-size="14.5" font-weight="650">quiver 1.3.2: the server builds secondary keys after the import</text><rect x="0" y="32" width="160" height="64" rx="12" fill="#161b22" stroke="#30363d"/><text x="80.0" y="60.0" font-size="14" font-weight="650" text-anchor="middle">parts</text><text x="80.0" y="78.0" font-size="11.5" text-anchor="middle" class="muted">clustered records</text><line x1="162" y1="64.0" x2="192" y2="64.0" stroke="#6e7681" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="196,64.0 187,59.0 187,69.0" fill="#6e7681"/><rect x="198" y="32" width="150" height="64" rx="12" fill="#161b22" stroke="#30363d"/><text x="273.0" y="60.0" font-size="14" font-weight="650" text-anchor="middle">.ibd + Check</text><text x="273.0" y="78.0" font-size="11.5" text-anchor="middle" class="muted">one tree</text><line x1="350" y1="64.0" x2="380" y2="64.0" stroke="#6e7681" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="384,64.0 375,59.0 375,69.0" fill="#6e7681"/><rect x="386" y="32" width="150" height="64" rx="12" fill="#161b22" stroke="#30363d"/><text x="461.0" y="60.0" font-size="14" font-weight="650" text-anchor="middle">IMPORT</text><text x="461.0" y="78.0" font-size="11.5" text-anchor="middle" class="muted">one tree</text><line x1="538" y1="64.0" x2="568" y2="64.0" stroke="#6e7681" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="572,64.0 563,59.0 563,69.0" fill="#6e7681"/><rect x="574" y="32" width="306" height="64" rx="12" fill="#161b22" stroke="#30363d"/><text x="727.0" y="51.0" font-size="14" font-weight="650" text-anchor="middle">ALTER TABLE … ADD KEY</text><text x="727.0" y="69.0" font-size="11.5" text-anchor="middle" class="muted">server: scan, sort, load each index</text><text x="727.0" y="84.0" font-size="11.5" text-anchor="middle" class="muted">after everything else of the table</text><text x="0" y="134" font-size="14.5" font-weight="650" class="accent">quiver 1.3.3: quiver builds them into the file</text><rect x="0" y="148" width="160" height="80" rx="12" fill="#2a1a10" stroke="#ff8a3d" stroke-dasharray="4 4"/><text x="80.0" y="175.0" font-size="14" font-weight="650" text-anchor="middle">parts</text><text x="80.0" y="193.0" font-size="11.5" text-anchor="middle" class="muted">records of every index</text><text x="80.0" y="208.0" font-size="11.5" text-anchor="middle" class="muted">on the renderers</text><line x1="162" y1="188.0" x2="192" y2="188.0" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="196,188.0 187,183.0 187,193.0" fill="#ff8a3d"/><rect x="198" y="148" width="166" height="80" rx="12" fill="#2a1a10" stroke="#ff8a3d" stroke-dasharray="4 4"/><text x="281.0" y="175.0" font-size="14" font-weight="650" text-anchor="middle">sort each part</text><text x="281.0" y="193.0" font-size="11.5" text-anchor="middle" class="muted">on a thread, by a 14-byte</text><text x="281.0" y="208.0" font-size="11.5" text-anchor="middle" class="muted">key prefix, to scratch</text><line x1="366" y1="188.0" x2="396" y2="188.0" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="400,188.0 391,183.0 391,193.0" fill="#ff8a3d"/><rect x="402" y="148" width="166" height="80" rx="12" fill="#2a1a10" stroke="#ff8a3d" stroke-dasharray="4 4"/><text x="485.0" y="175.0" font-size="14" font-weight="650" text-anchor="middle">merge by ranges</text><text x="485.0" y="193.0" font-size="11.5" text-anchor="middle" class="muted">of key prefixes, an index</text><text x="485.0" y="208.0" font-size="11.5" text-anchor="middle" class="muted">over several threads</text><line x1="570" y1="188.0" x2="600" y2="188.0" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="604,188.0 595,183.0 595,193.0" fill="#ff8a3d"/><rect x="606" y="148" width="132" height="80" rx="12" fill="#2a1a10" stroke="#ff8a3d" stroke-dasharray="4 4"/><text x="672.0" y="175.0" font-size="14" font-weight="650" text-anchor="middle">Check</text><text x="672.0" y="193.0" font-size="11.5" text-anchor="middle" class="muted">every tree, entries</text><text x="672.0" y="208.0" font-size="11.5" text-anchor="middle" class="muted">and UNIQUE keys</text><line x1="740" y1="188.0" x2="770" y2="188.0" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="774,188.0 765,183.0 765,193.0" fill="#ff8a3d"/><rect x="776" y="148" width="104" height="80" rx="12" fill="#161b22" stroke="#30363d"/><text x="828.0" y="184.0" font-size="14" font-weight="650" text-anchor="middle">IMPORT</text><text x="828.0" y="202.0" font-size="11.5" text-anchor="middle" class="muted">all indexes</text><text x="0" y="250" font-size="11.5" class="muted">Keys over collated text, floats or DESC columns, of a table without a primary key, SPATIAL and FULLTEXT stay with ALTER, in their places.</text><text x="0" y="300" font-size="14.5" font-weight="650">After the last part of a 10 M-row table with three keys (laptop, release build)</text><text x="0" y="338" font-size="13" font-weight="650">1.3.2</text><rect x="92.0" y="318" width="112.5" height="30" rx="6" fill="#b5541f"/><text x="148.3" y="337.5" font-size="11.5" text-anchor="middle">check 2.1 s</text><rect x="206.5" y="318" width="79.8" height="30" rx="6" fill="#3d444d"/><text x="246.5" y="337.5" font-size="11.5" text-anchor="middle">import 1.5 s</text><rect x="288.4" y="318" width="401.6" height="30" rx="6" fill="#6e7681"/><text x="489.2" y="337.5" font-size="11.5" text-anchor="middle">ALTER … ADD KEY 7.4 s</text><text x="700.0" y="338" font-size="13" font-weight="650">11.0 s</text><text x="0" y="382" font-size="13" font-weight="650">1.3.3</text><rect x="92.0" y="362" width="85.3" height="30" rx="6" fill="#ff8a3d"/><text x="134.6" y="381.5" font-size="11.5" text-anchor="middle">merge 1.6 s</text><rect x="179.3" y="362" width="172.5" height="30" rx="6" fill="#b5541f"/><text x="265.5" y="381.5" font-size="11.5" text-anchor="middle">check 3.2 s</text><rect x="353.8" y="362" width="205.3" height="30" rx="6" fill="#3d444d"/><text x="456.5" y="381.5" font-size="11.5" text-anchor="middle">import 3.8 s</text><text x="569.1" y="382" font-size="13" font-weight="650">8.6 s</text><text x="0" y="428" font-size="11.5" class="muted">The other pair: 11.1 s and 9.9 s (the import took 5.5 s). The whole copy stayed within noise on the laptop, where the source shared the cores;</text><text x="0" y="444" font-size="11.5" class="muted">with the source elsewhere the tail of the largest table runs under the reading of the others.</text></svg>