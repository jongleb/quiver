# A quiverfile: defaults for quiver's options, by their long names (quiver <command> --help).
# Copy it to quiverfile.yaml in the directory you run quiver from, or pass --quiverfile FILE,
# or set QUIVERFILE. The command line and QUIVER_<NAME> variables win over it.

# At the top: every command that has the option.
host: db1.internal            # the source; without host, the local socket as mysql finds it
user: dumper
tls-ca: /etc/ssl/db-ca.pem
net-timeout: 600

# Under a command's name: that command alone.
dump:
  database: [shop, billing]   # a list gives the option once per item
  outputdir: /backups/today
  threads: 16
  compress: zstd
  objects: all

copy:
  database: shop
  to-host: db2.internal
  to-user: loader
  to-database: shop_copy
  threads: 8
  target-threads: 16
  secondary-keys: after-data
  ingest: tablespace          # MySQL 8.4 target on this machine
  binlog: skip
  tablespace-keys: server     # quiver (the default): keys it can order built into the file
  read-order: largest-tables  # largest-chunks (the default): the largest chunks first
  declare-tables: all-at-once # before-rows (the default): a table just before its rows
  sort-dir: /fast/scratch
  build-threads: 8
  data-table: [shop.orders, shop.items]
  mask:                       # masked as read: null, text:VALUE, shape, email, hash, keep, sql:…, expr:…
    shop.users:               # a map gives the option once per leaf: shop.users.name=shape …
      name: shape
      passport: hash
    "*.*.email": email        # quote keys that start with *
  mask-script: [policy.scm]   # your own masking policy in S-expressions: quiver mask --help
  mask-strict: [shop.users]   # every column of these tables masked or kept, or nothing is read
  mask-secret: change-me      # the same secret masks the same value the same way every run
  after-load:                 # run on the target once the rows and keys are in, {table} its name
    shop.orders: "UPDATE {table} SET comment = NULL"

load:
  directory: /backups/today
  threads: 8
