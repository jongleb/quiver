    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="10" y="18" font-size="14.5" font-weight="650">The global lock lasts one round trip, not one per session</text><text x="10" y="54" font-size="12.5" class="muted">one by one</text><rect x="150.0" y="40" width="700.0" height="20" rx="5" fill="#6e7681" opacity="0.85"/><text x="500.0" y="54" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">lock held for N round trips</text><rect x="220.0" y="66" width="140.0" height="20" rx="5" fill="#6e7681" opacity="0.55"/><text x="290.0" y="80" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 1</text><rect x="360.0" y="90" width="140.0" height="20" rx="5" fill="#6e7681" opacity="0.55"/><text x="430.0" y="104" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 2</text><rect x="500.0" y="114" width="140.0" height="20" rx="5" fill="#6e7681" opacity="0.55"/><text x="570.0" y="128" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 3</text><rect x="640.0" y="138" width="140.0" height="20" rx="5" fill="#6e7681" opacity="0.55"/><text x="710.0" y="152" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 4</text><text x="10" y="194" font-size="12.5" class="mono">quiver</text><rect x="150.0" y="180" width="210.0" height="20" rx="5" fill="#ff8a3d" opacity="1"/><text x="255.0" y="194" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">lock</text><rect x="220.0" y="206" width="140.0" height="20" rx="5" fill="#58a6ff" opacity="0.8"/><text x="290.0" y="220" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 1</text><rect x="220.0" y="230" width="140.0" height="20" rx="5" fill="#58a6ff" opacity="0.8"/><text x="290.0" y="244" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 2</text><rect x="220.0" y="254" width="140.0" height="20" rx="5" fill="#58a6ff" opacity="0.8"/><text x="290.0" y="268" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 3</text><rect x="220.0" y="278" width="140.0" height="20" rx="5" fill="#58a6ff" opacity="0.8"/><text x="290.0" y="292" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">session 4</text><rect x="220.0" y="302" width="140.0" height="20" rx="5" fill="#ffc15e" opacity="1"/><text x="290.0" y="316" font-size="11" text-anchor="middle" style="fill:#ffffff" font-weight="650">binlog + GTID</text><text x="388" y="194" font-size="11.5" class="muted">UNLOCK only after every session has its snapshot and the position is taken</text></svg>
