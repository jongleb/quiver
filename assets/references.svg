    </style><text x="0.0" y="18.0" font-size="14.5" font-weight="650">One permute on a key, every reference follows: shop, copied with three rules</text><rect x="0" y="82" width="190" height="76" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-dasharray="4 4"/><text x="95.0" y="107.0" font-size="14" font-weight="650" text-anchor="middle">users.id</text><text x="95.0" y="125.0" font-size="11.5" text-anchor="middle" class="muted">permute</text><text x="95.0" y="140.0" font-size="11.5" text-anchor="middle" class="muted">1 → 283289981</text><line x1="192.0" y1="120.0" x2="324.4" y2="54.8" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="328.0,53.0 322.1,61.5 317.7,52.5" fill="#e8590c"/><line x1="192.0" y1="120.0" x2="324.1" y2="95.7" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="328.0,95.0 320.1,101.5 318.2,91.7" fill="#e8590c"/><line x1="192.0" y1="120.0" x2="324.0" y2="136.5" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="328.0,137.0 318.4,140.8 319.7,130.9" fill="#e8590c"/><line x1="192.0" y1="120.0" x2="324.3" y2="177.4" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 5"/><polygon points="328.0,179.0 317.8,180.0 321.7,170.8" fill="#e8590c"/><rect x="330" y="36" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344.0" y="58.0" font-size="12.5" font-weight="650" class="mono">users.manager_id</text><text x="546.0" y="58.0" font-size="11.5" class="muted">a self-reference</text><rect x="330" y="78" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344.0" y="100.0" font-size="12.5" font-weight="650" class="mono">addresses.user_id</text><text x="546.0" y="100.0" font-size="11.5" class="muted">a foreign key</text><rect x="330" y="120" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344.0" y="142.0" font-size="12.5" font-weight="650" class="mono">orders.user_id</text><text x="546.0" y="135.0" font-size="11.5" class="muted">a foreign key: 283289981 still has</text><text x="546.0" y="150.0" font-size="11.5" class="muted">the 2 orders user 1 has in prod</text><rect x="330" y="162" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="4 4"/><text x="344.0" y="184.0" font-size="12.5" font-weight="650" class="mono">events.user_ref</text><text x="546.0" y="177.0" font-size="11.5" class="muted">no FOREIGN KEY: declared in the policy,</text><text x="546.0" y="192.0" font-size="11.5" class="muted">(references "shop.events.user_ref" "shop.users.id")</text><rect x="0" y="214" width="190" height="76" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-dasharray="4 4"/><text x="95.0" y="230.0" font-size="14" font-weight="650" text-anchor="middle">users.email</text><text x="95.0" y="248.0" font-size="11.5" text-anchor="middle" class="muted">permute</text><text x="95.0" y="263.0" font-size="11.5" text-anchor="middle" class="muted">ivan.petrov1@mail.ru →</text><text x="95.0" y="278.0" font-size="11.5" text-anchor="middle" class="muted">dvjv.cainmk1@omkz.vx</text><line x1="192.0" y1="252.0" x2="324.0" y2="252.0" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="328.0,252.0 319.0,257.0 319.0,247.0" fill="#e8590c"/><rect x="330" y="235" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344.0" y="257.0" font-size="12.5" font-weight="650" class="mono">orders.email</text><text x="546.0" y="250.0" font-size="11.5" class="muted">a foreign key to a unique email; equal in</text><text x="546.0" y="265.0" font-size="11.5" class="muted">utf8mb4_0900_ai_ci before, equal after</text><rect x="0" y="308" width="190" height="76" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-dasharray="4 4"/><text x="95.0" y="324.0" font-size="14" font-weight="650" text-anchor="middle">orders.id</text><text x="95.0" y="342.0" font-size="11.5" text-anchor="middle" class="muted">permute</text><text x="95.0" y="357.0" font-size="11.5" text-anchor="middle" class="muted">20000 →</text><text x="95.0" y="372.0" font-size="11.5" text-anchor="middle" class="muted">7516915763705941</text><line x1="192.0" y1="346.0" x2="324.0" y2="328.5" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="328.0,328.0 319.7,334.1 318.4,324.2" fill="#e8590c"/><line x1="192.0" y1="346.0" x2="324.1" y2="369.3" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="328.0,370.0 318.3,373.4 320.0,363.5" fill="#e8590c"/><rect x="330" y="311" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344.0" y="333.0" font-size="12.5" font-weight="650" class="mono">items.order_id</text><text x="546.0" y="326.0" font-size="11.5" class="muted">part of the primary key: order 20000's</text><text x="546.0" y="341.0" font-size="11.5" class="muted">2 items stay with it</text><rect x="330" y="353" width="200" height="34" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><text x="344.0" y="375.0" font-size="12.5" font-weight="650" class="mono">payments.order_id</text><text x="546.0" y="375.0" font-size="11.5" class="muted">a foreign key</text><text x="0.0" y="422.0" font-size="14.5" font-weight="650" class="accent">Why a bijection, not a hash: 20 M ids masked into INT</text><text x="0.0" y="452.0" font-size="13" font-weight="650" class="mono">hash</text><rect x="80" y="434" width="560" height="26" rx="6" fill="#cf222e" opacity="0.85"/><text x="92.0" y="452.0" font-size="11.5">≈ 93 000 pairs of rows get one id: the copy fails on duplicate keys</text><text x="0.0" y="486.0" font-size="13" font-weight="650" class="mono">permute</text><rect x="80" y="468" width="6" height="26" rx="3" fill="#1a7f37" opacity="0.85"/><text x="96.0" y="486.0" font-size="11.5">0: FF1 of NIST SP 800-38G with cycle walking, two ids never give one</text><text x="0.0" y="518.0" font-size="11.5" class="muted">On the copy every join holds as in prod: orders → users 50 000 by id and 37 500 by email, items 100 000, payments 50 000,</text><text x="0.0" y="534.0" font-size="11.5" class="muted">addresses 20 000, events 30 000, managers 19 990. LOAD DATA, tablespace, dump → load, agent → collector: one CHECKSUM.</text><text x="0.0" y="550.0" font-size="11.5" class="muted">A table whose key is masked loads through LOAD DATA in a tablespace copy; quiver.json leaves out its chunk ranges.</text></svg>