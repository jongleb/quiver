    </style><text x="10" y="18" font-size="14.5" font-weight="650">One frame: a 32-byte header, then the payload</text><rect x="42" y="46" width="98" height="46" rx="8" fill="#1f5fa8" opacity="0.18"/><rect x="42" y="46" width="98" height="46" rx="8" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="91.0" y="74" font-size="13.5" font-weight="650" text-anchor="middle" class="mono">"QW"</text><line x1="91.0" y1="95" x2="91.0" y2="100" stroke="#1f5fa8" stroke-width="1"/><text x="91.0" y="112" font-size="11.5" text-anchor="middle" class="muted">magic</text><rect x="144" y="46" width="47" height="46" rx="8" fill="#1f5fa8" opacity="0.18"/><rect x="144" y="46" width="47" height="46" rx="8" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="167.5" y="74" font-size="12" font-weight="650" text-anchor="middle" class="mono">6</text><line x1="167.5" y1="95" x2="167.5" y2="116" stroke="#1f5fa8" stroke-width="1"/><text x="167.5" y="128" font-size="11.5" text-anchor="middle" class="muted">version</text><rect x="195" y="46" width="47" height="46" rx="8" fill="#d0d7de" opacity="0.18"/><rect x="195" y="46" width="47" height="46" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.4"/><text x="218.5" y="74" font-size="12" font-weight="650" text-anchor="middle" class="mono">0</text><rect x="246" y="46" width="47" height="46" rx="8" fill="#f59f00" opacity="0.18"/><rect x="246" y="46" width="47" height="46" rx="8" fill="none" stroke="#f59f00" stroke-width="1.4"/><text x="269.5" y="74" font-size="12" font-weight="650" text-anchor="middle" class="mono">kind</text><line x1="269.5" y1="95" x2="269.5" y2="100" stroke="#f59f00" stroke-width="1"/><text x="269.5" y="112" font-size="11.5" text-anchor="middle" class="muted">message, batch, ack</text><rect x="297" y="46" width="47" height="46" rx="8" fill="#f59f00" opacity="0.18"/><rect x="297" y="46" width="47" height="46" rx="8" fill="none" stroke="#f59f00" stroke-width="1.4"/><text x="320.5" y="74" font-size="12" font-weight="650" t