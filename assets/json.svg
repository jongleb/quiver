<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 240" width="880" height="240" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #e8590c; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="0" y="18" font-size="14.5" font-weight="650">A double the server prints in a JSON column, copied</text><rect x="0" y="36" width="250" height="152" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="125" y="62" font-size="11.5" text-anchor="middle" class="muted">source</text><text x="125" y="108" font-size="12" font-weight="600" text-anchor="middle" class="mono">{"v": 9.999999999999999e24}</text><text x="125" y="132" font-size="11.5" text-anchor="middle" class="muted">its shortest exact text</text><line x1="252" y1="72" x2="326" y2="72" stroke="#9aa4ae" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="330,72 321,67 321,77" fill="#9aa4ae" transform="rotate(0.0 330 72)"/><rect x="332" y="42" width="300" height="60" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="482.0" y="68.0" font-size="14" font-weight="650" text-anchor="middle">as text</text><text x="482.0" y="86.0" font-size="11.5" text-anchor="middle" class="muted">LOAD DATA, mysqldump, mydumper, quiver 1.2</text><line x1="634" y1="72" x2="658" y2="72" stroke="#9aa4ae" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="662,72 653,67 653,77" fill="#9aa4ae" transform="rotate(0.0 662 72)"/><rect x="664" y="42" width="216" height="60" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="772" y="68" font-size="13" font-weight="650" text-anchor="middle" class="mono">1e25</text><text x="772" y="88" font-size="11.5" text-anchor="middle" class="muted">a neighbour, silently</text><line x1="252" y1="152" x2="326" y2="152" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="330,152 321,147 321,157" fill="#e8590c" transform="rotate(0.0 330 152)"/><rect x="332" y="118" width="300" height="70" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-dasharray="4 4"/><text x="482" y="140" font-size="14" font-weight="650" text-anchor="middle" class="accent">quiver 1.3</text><text x="482" y="158" font-size="10.5" text-anchor="middle" class="mono">JSON_SET(text, '$.v', 9.999999999999999e24)</text><text x="482" y="176" font-size="11.5" text-anchor="middle" class="muted">or the binary JSON in a built tablespace</text><line x1="634" y1="152" x2="658" y2="152" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="662,152 653,147 653,157" fill="#e8590c" transform="rotate(0.0 662 152)"/><rect x="664" y="118" width="216" height="70" rx="12" fill="#fff1e8" stroke="#e8590c"/><text x="772" y="148" font-size="13" font-weight="650" text-anchor="middle" class="mono">9.999999999999999e24</text><text x="772" y="168" font-size="11.5" text-anchor="middle" class="accent">the same double</text><text x="0" y="216" font-size="11.5" class="muted">The server parses JSON text with RapidJSON's fast path and reads about one in nine of its own</text><text x="0" y="232" font-size="11.5" class="muted">shortest double texts as the next double. A live copy through LOAD DATA changed 63 of 553 documents.</text></svg>