    </style><path d="M10,38 v72 a55.0,10 0 0 0 110,0 v-72" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><ellipse cx="65.0" cy="38" rx="55.0" ry="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/><text x="65.0" y="78.0" font-size="14.5" font-weight="650" text-anchor="middle">source</text><text x="65.0" y="95.0" font-size="11" text-anchor="middle" class="muted">MySQL</text><rect x="150" y="40" width="130" height="68" rx="12" fill="#161b22" stroke="#30363d"/><text x="215.0" y="71.0" font-size="15" font-weight="650" text-anchor="middle">agent</text><text x="215.0" y="90.0" font-size="11.5" text-anchor="middle" class="muted">zstd once, S streams</text><line x1="122" y1="74" x2="144" y2="74" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="148,74 139,69 139,79" fill="#ff8a3d" transform="rotate(0.0 148 74)"/><rect x="340" y="40" width="120" height="68" rx="12" fill="#161b22" stroke="#30363d"/><text x="400.0" y="71.0" font-size="15" font-weight="650" text-anchor="middle">relay</text><text x="400.0" y="90.0" font-size="11.5" text-anchor="middle" class="muted">forwards bytes</text><line x1="282" y1="60" x2="334" y2="60" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" class="flow"/><polygon points="338,60 329,55 329,65" fill="#ff8a3d" transform="rotate(0.0 338 60)"/><line x1="282" y1="74" x2="334" y2="74" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" class="flow"/><polygon points="338,74 329,69 329,79" fill="#ff8a3d" transform="rotate(0.0 338 74)"/><line x1="282" y1="88" x2="334" y2="88" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" class="flow"/><polygon points="338,88 329,83 329,93" fill="#ff8a3d" transform="rotate(0.0 338 88)"/><rect x="520" y="40" width="140" height="68" rx="12" fill="#161b22" stroke="#30363d"/><text x="590.0" y="71.0" font-size="15" font-weight="650" text-anchor="middle">collect</text><text x="590.0" y="90.0" font-size="11.5" text-anchor="middle" class="muted">files or a server</text><line x1="462" y1="60" x2="514" y2="60" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" class="flow"/><polygon points="518,60 509,55 509,65" fill="#ff8a3d" transform="rotate(0.0 518 60)"/><line x1="462" y1="74" x2="514" y2="74" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" class="flow"/><polygon points="518,74 509,69 509,79" fill="#ff8a3d" transform="rotate(0.0 518 74)"/><line x1="462" y1="88" x2="514" y2="88" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round" class="flow"/><polygon points="518,88 509,83 509,93" fill="#ff8a3d" transform="rotate(0.0 518 88)"/><rect x="730" y="40" width="140" height="68" rx="12" fill="#161b22" stroke="#30363d"/><text x="800.0" y="71.0" font-size="15" font-weight="650" text-anchor="middle">collect</text><text x="800.0" y="90.0" font-size="11.5" text-anchor="middle" class="muted">--forward, next copy</text><line x1="662" y1="74" x2="724" y2="74" stroke="#ff8a3d" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="728,74 719,69 719,79" fill="#ff8a3d" transform="rotate(0.0 728 74)"/><text x="10" y="150" font-size="12.5" class="muted">Mutual TLS 1.3 on every hop. Every frame is acknowledged; a broken stream hands its frames to the others. Streams and zstd level follow the link.</text></svg>
