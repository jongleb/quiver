="150" width="200" height="46" rx="8" fill="none" stroke="#1f5fa8" stroke-width="1.4"/><text x="346.0" y="178" font-size="13.5" font-weight="650" text-anchor="middle" class="mono">raw</text><line x1="346.0" y1="199" x2="346.0" y2="204" stroke="#1f5fa8" stroke-width="1"/><text x="346.0" y="216" font-size="11.5" text-anchor="middle" class="muted">after decoding</text><rect x="450" y="150" width="200" height="46" rx="8" fill="#e8590c" opacity="0.18"/><rect x="450" y="150" width="200" height="46" rx="8" fill="none" stroke="#e8590c" stroke-width="1.4"/><text x="550.0" y="178" font-size="13.5" font-weight="650" text-anchor="middle" class="mono">xxh3</text><line x1="550.0" y1="199" x2="550.0" y2="204" stroke="#e8590c" stroke-width="1"/><text x="550.0" y="216" font-size="11.5" text-anchor="middle" class="muted">of the payload</text><rect x="654" y="150" width="200" height="46" rx="8" fill="#e8590c" opacity="0.18"/><rect x="654" y="150" width="200" height="46" rx="8" fill="none" stroke="#e8590c" stroke-width="1.4"/><text x="754.0" y="178" font-size="13.5" font-weight="650" text-anchor="middle" class="mono">xxh3</text><line x1="754.0" y1="199" x2="754.0" y2="204" stroke="#e8590c" stroke-width="1"/><text x="754.0" y="216" font-size="11.5" text-anchor="middle" class="muted">of the 28 bytes before</text><text x="32" y="74" font-size="11" text-anchor="end" class="mono muted">0</text><text x="32" y="178" font-size="11" text-anchor="end" class="mono muted">16</text><rect x="42" y="254" width="812" height="46" rx="8" fill="#fff1e8" stroke="#e8590c" stroke-dasharray="5 4"/><text x="448" y="274" font-size="13.5" font-weight="650" text-anchor="middle">payload: a message, or a batch as its column buffers lie in memory</text><text x="448" y="291" font-size="11.5" text-anchor="middle" class="muted">zstd only when it comes out shorter</text><text x="32" y="282" font-size="11" text-anchor="end" class="mono muted">32</text><text x="10" y="326" font-size="12.5" class="muted">Little-endian. A 