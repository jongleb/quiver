    </style><text x="0.0" y="18.0" font-size="14.5" font-weight="650">Masked where it is read: the real values never leave the reader</text><rect x="0" y="34" width="150" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="75.0" y="54.0" font-size="14" font-weight="650" text-anchor="middle">MySQL</text><text x="75.0" y="72.0" font-size="11.5" text-anchor="middle" class="muted">one snapshot</text><text x="75.0" y="87.0" font-size="11.5" text-anchor="middle" class="muted">sql: rules evaluated</text><text x="75.0" y="102.0" font-size="11.5" text-anchor="middle" class="muted">by the source</text><line x1="152.0" y1="76.0" x2="182.0" y2="76.0" stroke="#9aa4ae" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="186.0,76.0 177.0,81.0 177.0,71.0" fill="#9aa4ae"/><rect x="188" y="34" width="150" height="84" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><text x="263.0" y="63.0" font-size="14" font-weight="650" text-anchor="middle">readers</text><text x="263.0" y="81.0" font-size="11.5" text-anchor="middle" class="muted">rows into batches</text><text x="263.0" y="96.0" font-size="11.5" text-anchor="middle" class="muted">real values, in memory</text><line x1="340.0" y1="76.0" x2="370.0" y2="76.0" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round" class="flow"/><polygon points="374.0,76.0 365.0,81.0 365.0,71.0" fill="#e8590c"/><rect x="376" y="34" width="190" height="84" rx="12" fill="#fff1e8" stroke="#e8590c" stroke-dasharray="4 4"/><text x="471.0" y="54.0" font-size="14" font-weight="650" text-anchor="middle">mask</text><text x="471.0" y="72.0" font-size="11.5" text-anchor="middle" class="muted">on the renderers, keyed</text><text x="471.0" y="87.0" font-size="11.5" text-anchor="middle" class="muted">by --mask-secret: a value</text><text x="471.0" y="102.0" font-size="11.5" text-anchor="middle" class="muted">masks alike in every run</text><line x1="572.0" y1="70.0" x2="598.8" y2="49.4" stroke="#e8590c" stroke-width="2.2" stroke-linecap="round