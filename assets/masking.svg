lass="muted mono">{"ip": "10.0.1.1", …}</text><text x="262.0" y="369.0" font-size="12" class="accent mono">{"ip": "0.0.0.0", …}</text><text x="452.0" y="369.0" font-size="11.5">sql: JSON_SET by the source</text><text x="0.0" y="403.0" font-size="11.5" class="muted">Refused before anything is read: a rule that names nothing, NULL for NOT NULL, a value the type cannot hold,</text><text x="0.0" y="419.0" font-size="11.5" class="muted">a key under an action that can make two values one, columns tied by foreign keys masked differently,</text><text x="0.0" y="435.0" font-size="11.5" class="muted">a column of a (strict …) table that no rule decides on. Every masked column goes into quiver.json.</text></svg>