<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 278" width="880" height="278" role="img"><style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .accent { fill: #e8590c; }
    .flow { stroke-dasharray: 7 9; animation: flow 1.1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style><text x="10" y="18" font-size="14.5" font-weight="650">A stream breaks: its unacknowledged frames go to the others</text><text x="10" y="63" font-size="12.5" class="mono">stream 1</text><line x1="110" y1="58" x2="870" y2="58" stroke="#d0d7de"/><rect x="120" y="44" width="40" height="28" rx="6" fill="#e8590c"/><text x="140" y="63" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">1</text><rect x="270" y="44" width="40" height="28" rx="6" fill="#e8590c"/><text x="290" y="63" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">4</text><rect x="420" y="44" width="40" height="28" rx="6" fill="#e8590c"/><text x="440" y="63" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">7</text><rect x="558" y="44" width="64" height="28" rx="6" fill="#1f5fa8"/><text x="590" y="63" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">5 again</text><rect x="670" y="44" width="40" height="28" rx="6" fill="#e8590c"/><text x="690" y="63" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">10</text><text x="10" y="109" font-size="12.5" class="mono">stream 2</text><line x1="110" y1="104" x2="870" y2="104" stroke="#d0d7de"/><rect x="170" y="90" width="40" height="28" rx="6" fill="#e8590c"/><text x="190" y="109" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">2</text><rect x="320" y="90" width="40" height="28" rx="6" fill="none" stroke="#e8590c" stroke-dasharray="3 3"/><text x="340" y="109" font-size="12" text-anchor="middle" class="muted">5</text><rect x="470" y="90" width="40" height="28" rx="6" fill="none" stroke="#e8590c" stroke-dasharray="3 3"/><text x="490" y="109" font-size="12" text-anchor="middle" class="muted">8</text><text x="10" y="155" font-size="12.5" class="mono">stream 3</text><line x1="110" y1="150" x2="870" y2="150" stroke="#d0d7de"/><rect x="220" y="136" width="40" height="28" rx="6" fill="#e8590c"/><text x="240" y="155" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">3</text><rect x="370" y="136" width="40" height="28" rx="6" fill="#e8590c"/><text x="390" y="155" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">6</text><rect x="520" y="136" width="40" height="28" rx="6" fill="#e8590c"/><text x="540" y="155" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">9</text><rect x="608" y="136" width="64" height="28" rx="6" fill="#1f5fa8"/><text x="640" y="155" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">8 again</text><rect x="720" y="136" width="40" height="28" rx="6" fill="#e8590c"/><text x="740" y="155" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">11</text><text x="10" y="201" font-size="12.5" class="mono">stream 2′</text><line x1="110" y1="196" x2="870" y2="196" stroke="#d0d7de"/><rect x="770" y="182" width="40" height="28" rx="6" fill="#e8590c"/><text x="790" y="201" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">12</text><rect x="820" y="182" width="40" height="28" rx="6" fill="#e8590c"/><text x="840" y="201" font-size="12" font-weight="650" text-anchor="middle" style="fill:#ffffff">13</text><text x="524" y="110" font-size="18" font-weight="700" class="accent">✕</text><text x="544" y="109" font-size="11.5" class="muted">broken with frames 5 and 8 unacknowledged</text><text x="10" y="250" font-size="12.5" class="muted">The last node acknowledges every batch frame on the stream it came by. Up to 32 frames per stream wait for their ack;</text><text x="10" y="268" font-size="12.5" class="muted">a broken stream is replaced in the same session, and the session ends only when none can be.</text></svg>
