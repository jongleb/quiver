me 2</text><line x1="584" y1="346" x2="328" y2="346" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round"/><polygon points="332,346 323,341 323,351" fill="#58a6ff" transform="rotate(180.0 332 346)"/><text x="460.0" y="339" font-size="12" text-anchor="middle" class="mono">Ack 3</text><text x="460.0" y="361" font-size="11" text-anchor="middle" class="muted">frames received on this stream</text><line x1="116" y1="388" x2="794" y2="388" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="798,388 789,383 789,393" fill="#ff8a3d" transform="rotate(0.0 798 388)"/><text x="455.0" y="381" font-size="12" text-anchor="middle" class="mono">End { chunk 7, frames 3 }</text><line x1="794" y1="424" x2="108" y2="424" stroke="#58a6ff" stroke-width="1.8" stroke-linecap="round"/><polygon points="112,424 103,419 103,429" fill="#58a6ff" transform="rotate(180.0 112 424)"/><text x="455.0" y="417" font-size="12" text-anchor="middle" class="mono">Committed { chunk 7, part }</text><text x="455.0" y="439" font-size="11" text-anchor="middle" class="muted">once durable here and at every node after</text><line x1="116" y1="468" x2="794" y2="468" stroke="#ff8a3d" stroke-width="1.8" stroke-linecap="round"/><polygon points="798,468 789,463 789,473" fill="#ff8a3d" transform="rotate(0.0 798 468)"/><text x="455.0" y="461" font-size="12" text-anchor="middle" class="mono">Finish { manifest } · Leave</text><text x="10" y="545" font-size="12.5" class="muted">Readers never wait for a commit: many chunks are in flight, and the frames of any chunk take any free stream.</text></svg>
